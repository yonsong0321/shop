  try {
    const raw = localStorage.getItem('lookbook_cart');
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function saveCart() {
  localStorage.setItem('lookbook_cart', JSON.stringify(cart));

function cartTotalQty() {
  return cart.reduce((sum, item) => sum + item.qty, 0);
}
function cartTotalPrice() {
  return cart.reduce((sum, item) => sum + item.price * item.qty, 0);

    `<button class="${state.view === 'list' && state.category === cat ? 'active' : ''}" data-cat="${cat}">${cat}</button>`
  ).join('');
  categoryNav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.view = 'list';
      state.category = btn.dataset.cat;
      render();
    });
  });
  cartBadge.textContent = cartTotalQty();
}

function render() {
  renderHeader();
  if (state.view === 'list') renderList();
  else if (state.view === 'detail') renderDetail();
  else if (state.view === 'cart') renderCart();
  else if (state.view === 'paymentResult') renderPaymentResult();
}

function renderList() {
  const items = state.category === '전체'
    ? PRODUCTS
    : PRODUCTS.filter(p => p.category === state.category);

  main.innerHTML = `
    <div class="grid">
      ${items.map(p => `
        <div class="card" data-id="${p.id}">
          <div class="thumb" style="background:${p.color}22">${placeholderSVG(p.shape, p.color, 120)}</div>
          <div class="card-info">
            <p class="card-name">${p.name}</p>
            <p class="card-price">${formatPrice(p.price)}</p>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  main.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      state.view = 'detail';
      state.productId = Number(card.dataset.id);
      selection = { size: null, color: null, qty: 1 };
      render();
    });
  });
}

function renderDetail() {
  const p = PRODUCTS.find(x => x.id === state.productId);
  main.innerHTML = `
    <button class="link-btn" id="backToList">← 목록으로</button>
    <div class="detail">
      <div class="detail-image" style="background:${p.color}22">${placeholderSVG(p.shape, p.color, 280)}</div>
      <div class="detail-info">
        <h1>${p.name}</h1>
        <p class="detail-price">${formatPrice(p.price)}</p>
        <p class="detail-desc">${p.desc}</p>

        <div class="option-group">
          <span class="option-label">사이즈</span>
          <div class="option-row" id="sizeRow">
            ${SIZES.map(s => `<button class="option-pill ${selection.size === s ? 'selected' : ''}" data-size="${s}">${s}</button>`).join('')}
          </div>
        </div>

        <div class="option-group">
          <span class="option-label">색상</span>
          <div class="option-row" id="colorRow">
            ${p.colors.map(c => `<button class="option-pill ${selection.color === c ? 'selected' : ''}" data-color="${c}">${c}</button>`).join('')}
          </div>
        </div>

        <div class="qty-row">
          <span class="option-label" style="margin-bottom:0">수량</span>
          <button class="qty-btn" id="qtyMinus">−</button>
          <span class="qty-value" id="qtyValue">${selection.qty}</span>
          <button class="qty-btn" id="qtyPlus">+</button>
        </div>

        <button class="primary-btn" id="addToCartBtn" ${selection.size && selection.color ? '' : 'disabled'}>
          장바구니에 담기
        </button>
      </div>
    </div>
  `;

  document.getElementById('backToList').addEventListener('click', () => {
    state.view = 'list';
    render();
  });
  main.querySelectorAll('#sizeRow button').forEach(btn => {
    btn.addEventListener('click', () => { selection.size = btn.dataset.size; renderDetail(); });
  });
  main.querySelectorAll('#colorRow button').forEach(btn => {
    btn.addEventListener('click', () => { selection.color = btn.dataset.color; renderDetail(); });
  });
  document.getElementById('qtyMinus').addEventListener('click', () => {
    selection.qty = Math.max(1, selection.qty - 1);
    renderDetail();
  });
  document.getElementById('qtyPlus').addEventListener('click', () => {
    selection.qty += 1;
    renderDetail();
  });
  document.getElementById('addToCartBtn').addEventListener('click', () => {
    if (!selection.size || !selection.color) return;
    addToCart(p, selection.size, selection.color, selection.qty);
    renderHeader();
  });
}

function addToCart(p, size, color, qty) {
  const existing = cart.find(item => item.productId === p.id && item.size === size && item.color === color);
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({
      productId: p.id, name: p.name, price: p.price,
      shape: p.shape, colorHex: p.color,
      size, color, qty,
    });
  }
  saveCart();
}

function renderCart() {
  if (cart.length === 0) {
    main.innerHTML = `
      <div class="empty-cart">
        <p>장바구니가 비었습니다.</p>
        <button class="primary-btn" id="goShopping">쇼핑 계속하기</button>
      </div>
    `;
    document.getElementById('goShopping').addEventListener('click', () => {
      state.view = 'list';
      render();
    });
    return;
  }

  main.innerHTML = `
    <div class="cart-list">
      ${cart.map((item, idx) => `
        <div class="cart-item" data-idx="${idx}">
          <div class="cart-thumb" style="background:${item.colorHex}22">${placeholderSVG(item.shape, item.colorHex, 60)}</div>
          <div class="cart-item-info">
            <p class="cart-item-name">${item.name}</p>
            <p class="cart-item-opt">${item.size} / ${item.color}</p>
          </div>
          <div class="cart-item-qty">
            <button class="qty-btn cart-qty-minus">−</button>
            <span class="qty-value">${item.qty}</span>
            <button class="qty-btn cart-qty-plus">+</button>
          </div>
          <div class="cart-item-subtotal">${formatPrice(item.price * item.qty)}</div>
          <button class="cart-remove" title="삭제">✕</button>
        </div>
      `).join('')}
    </div>
    <div class="cart-summary">
      <span class="cart-total">총 합계 ${formatPrice(cartTotalPrice())}</span>
      <button class="primary-btn" id="checkoutBtn">결제하기</button>
    </div>
  `;

  main.querySelectorAll('.cart-item').forEach(row => {
    const idx = Number(row.dataset.idx);
    row.querySelector('.cart-qty-minus').addEventListener('click', () => {
      cart[idx].qty = Math.max(1, cart[idx].qty - 1);
      saveCart();
      render();
    });
    row.querySelector('.cart-qty-plus').addEventListener('click', () => {
      cart[idx].qty += 1;
      saveCart();
      render();
    });
    row.querySelector('.cart-remove').addEventListener('click', () => {
      cart.splice(idx, 1);
      saveCart();
      render();
    });
  });

  document.getElementById('checkoutBtn').addEventListener('click', startCheckout);
}

/* ---------------- 결제 ---------------- */
function getCustomerKey() {
  let key = localStorage.getItem('lookbook_customer_key');
  if (!key) {
    key = 'cust_' + Array.from({ length: 24 }, () => Math.random().toString(36)[2] || '0').join('');
    localStorage.setItem('lookbook_customer_key', key);
  }
  return key;
}

async function startCheckout() {
  if (!tossPayments) {
    alert('결제 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }
  if (cart.length === 0) return;

  const amount = cartTotalPrice();
  const orderId = 'lookbook_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  const orderName = cart.length === 1 ? cart[0].name : `${cart[0].name} 외 ${cart.length - 1}건`;

  localStorage.setItem('lookbook_pending_order', JSON.stringify({ orderId, amount, orderName, items: cart }));

  const widgets = tossPayments.widgets({ customerKey: getCustomerKey() });
  await widgets.setAmount({ currency: 'KRW', value: amount });
  const paymentWindow = await widgets.renderPaymentWindow({ orderName });

  paymentWindow.on('paymentRequest', async () => {
    try {
      await widgets.requestPayment({
        orderId,
        orderName,
        successUrl: window.location.origin + window.location.pathname,
        failUrl: window.location.origin + window.location.pathname,
      });
    } catch (err) {
      if (!(err && err.code === 'USER_CANCEL')) {
        alert('결제 요청 중 오류가 발생했습니다: ' + (err && (err.message || err.code)));
      }
    }
    await paymentWindow.destroy();
  });
}

let paymentResult = null;

function handlePaymentRedirect() {
  const params = new URLSearchParams(window.location.search);
  const paymentKey = params.get('paymentKey');
  const code = params.get('code');
  if (!paymentKey && !code) return;

  const pendingRaw = localStorage.getItem('lookbook_pending_order');
  const pending = pendingRaw ? JSON.parse(pendingRaw) : null;

  if (paymentKey) {
    const amount = params.get('amount');
    const amountMismatch = pending && Number(amount) !== pending.amount;
    paymentResult = {
      status: 'success',
      paymentKey,
      orderId: params.get('orderId'),
      amount,
      amountMismatch,
      pending,
    };
    cart = [];
    saveCart();
  } else {
    paymentResult = {
      status: 'fail',
      code,
      message: params.get('message'),
      pending,
    };
  }
  localStorage.removeItem('lookbook_pending_order');
  state.view = 'paymentResult';
  window.history.replaceState({}, '', window.location.pathname);
}

function renderPaymentResult() {
  const r = paymentResult;
  const isSuccess = r.status === 'success';
  main.innerHTML = `
    <div class="pay-result">
      <div class="pay-result-icon">${isSuccess ? '✅' : '❌'}</div>
      <h1>${isSuccess ? '결제창 처리가 완료되었습니다' : '결제가 완료되지 않았습니다'}</h1>
      <p class="pay-result-note">
        ${isSuccess
          ? '이 데모는 토스페이먼츠 결제창 호출까지만 연동되어 있으며, 서버에서 처리해야 하는 결제 승인(confirm) 단계는 생략되어 실제 결제가 확정되지는 않습니다.'
          : `결제가 취소되었거나 실패했습니다. ${r.message ? '(' + r.message + ')' : ''}`}
      </p>
      ${isSuccess ? `
        <div class="pay-result-box">
          <p><strong>주문번호</strong> ${r.orderId || '-'}</p>
          <p><strong>결제금액</strong> ${formatPrice(Number(r.amount || 0))}</p>
          <p><strong>paymentKey</strong> ${r.paymentKey || '-'}</p>
        </div>
        ${r.amountMismatch ? `
          <p class="pay-result-note" style="color:#ff5a5f;">⚠ 결제 요청 금액과 리다이렉트로 전달된 금액이 일치하지 않습니다. 실제 서비스에서는 이 경우 결제를 취소 처리해야 합니다.</p>
        ` : ''}
      ` : ''}
      <button class="primary-btn" id="payResultBack">쇼핑 계속하기</button>
    </div>
  `;
  document.getElementById('payResultBack').addEventListener('click', () => {
    state.view = 'list';
    state.category = '전체';
    render();
  });
}

/* ---------------- 전역 이벤트 ---------------- */
document.getElementById('brandLogo').addEventListener('click', () => {
  state.view = 'list';
  state.category = '전체';
  render();
});
document.getElementById('cartBtn').addEventListener('click', () => {
  state.view = 'cart';
  render();
});

handlePaymentRedirect();
render();
</script>
</body>
</html>
